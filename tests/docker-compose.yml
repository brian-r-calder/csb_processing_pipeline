services:
  garage:
    image: dxflrs/garage:v2.2.0
    container_name: garage
    restart: unless-stopped
    volumes:
      - ./garage.toml:/etc/garage.toml
#      - garage_data:/var/lib/garage/data
#      - garage_meta:/var/lib/garage/meta
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3902:3902"

volumes:
  garage_data:
  garage_meta:
